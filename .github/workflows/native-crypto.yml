name: Native OpenMLS security gate

on:
  push:
    paths:
      - '.github/workflows/native-crypto.yml'
      - 'native/openmls_bridge/**'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - '.github/workflows/native-crypto.yml'
      - 'native/openmls_bridge/**'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-openmls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openmls:
    name: OpenMLS / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: >-
          rustup toolchain install 1.91.0
          --profile minimal
          --component clippy
          --component rustfmt

      - name: Verify formatting
        run: cargo +1.91.0 fmt --manifest-path native/openmls_bridge/Cargo.toml -- --check

      - name: Reject compiler and Clippy warnings
        run: >-
          cargo +1.91.0 clippy
          --manifest-path native/openmls_bridge/Cargo.toml
          --locked
          --all-targets
          --all-features
          --
          -D warnings

      - name: Run real MLS state-machine tests
        run: >-
          cargo +1.91.0 test
          --manifest-path native/openmls_bridge/Cargo.toml
          --locked
          --all-targets

      - name: Reject tracked source changes
        run: git diff --exit-code
