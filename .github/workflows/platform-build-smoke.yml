name: Native platform debug build smoke (non-release)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-build-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-build:
    name: ${{ matrix.app }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: everyday_chat
            platform: android
            runner: ubuntu-24.04
            build_target: apk
            build_flags: --debug --no-pub
          - app: secure_collab
            platform: android
            runner: ubuntu-24.04
            build_target: apk
            build_flags: --debug --no-pub
          - app: everyday_chat
            platform: linux
            runner: ubuntu-24.04
            build_target: linux
            build_flags: --debug --no-pub
          - app: secure_collab
            platform: linux
            runner: ubuntu-24.04
            build_target: linux
            build_flags: --debug --no-pub
          - app: everyday_chat
            platform: windows
            runner: windows-2025
            build_target: windows
            build_flags: --debug --no-pub
          - app: secure_collab
            platform: windows
            runner: windows-2025
            build_target: windows
            build_flags: --debug --no-pub
          - app: everyday_chat
            platform: ios
            runner: macos-15
            build_target: ios
            build_flags: --simulator --debug --no-pub
          - app: secure_collab
            platform: ios
            runner: macos-15
            build_target: ios
            build_flags: --simulator --debug --no-pub

    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.2'

      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes --no-install-recommends
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Resolve the locked workspace
        run: dart pub get --enforce-lockfile

      - name: Compile ephemeral debug target
        working-directory: apps/${{ matrix.app }}
        run: flutter build ${{ matrix.build_target }} ${{ matrix.build_flags }}

      - name: Reject tracked source changes
        run: git diff --exit-code
