[package]
name = "privacy_chat_collab_crdt"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
automerge = "=0.12.0"
thiserror = "=2.0.17"
unicode-segmentation = "=1.13.3"
zeroize = "=1.9.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
