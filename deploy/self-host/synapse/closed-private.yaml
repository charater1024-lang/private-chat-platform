# Privacy Talk closed-private profile
# Loaded after homeserver.yaml generated by the pinned Synapse image.
# This file intentionally contains no secrets.

report_stats: false

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses:
      - 0.0.0.0
    resources:
      - names:
          - client
        compress: false

# Closed by default: no federation listener, no published 8448 port, and no
# outbound federation destination is accepted.
federation_domain_whitelist: []
federation_whitelist_endpoint_enabled: true
allow_profile_lookup_over_federation: false
allow_device_name_lookup_over_federation: false
allow_public_rooms_over_federation: false
trusted_key_servers: []
suppress_key_server_warning: true

# The owner approves accounts. Provisioned local members may freely create
# encrypted 1:1 and invite-only group rooms.
enable_registration: false
enable_registration_without_verification: false
allow_guest_access: false
disable_msisdn_registration: true
enable_3pid_lookup: false

encryption_enabled_by_default_for_room_type: all
enable_room_list_search: false
room_list_publication_rules:
  - action: deny
allow_public_rooms_without_auth: false

# Authenticated members can discover other local members. This deliberate
# metadata trade-off is documented in docs/security-threat-model.md.
require_auth_for_profile_requests: true
user_directory:
  enabled: true
  search_all_users: true
  prefer_local_users: true
  exclude_remote_users: true
  show_locked_users: false

url_preview_enabled: false
enable_search: false
enable_metrics: false
stats:
  enabled: false

password_config:
  enabled: true
  localdb_enabled: true
  policy:
    enabled: true
    minimum_length: 15

push:
  # Native Synapse pushers disclose room/event identifiers even when message
  # content is excluded. Keep push fail-closed until an independently reviewed
  # opaque wake-up adapter exists.
  enabled: false
  include_content: false

# The client streams encrypted attachments. This ceiling matches the consumer
# generic-file policy; deployments should add per-user time-window quotas.
max_upload_size: 1G
