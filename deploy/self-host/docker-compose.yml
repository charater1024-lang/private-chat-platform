name: ${COMPOSE_PROJECT_NAME:-privacy-talk}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Copy .env.example to .env and pin an image digest}
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /run/postgresql:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      # Required by the official entrypoint while initializing a new volume
      # and changing to the postgres user.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 60s
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  synapse:
    image: ${SYNAPSE_IMAGE:?Copy .env.example to .env and pin an image digest}
    restart: unless-stopped
    init: true
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      UID: ${SYNAPSE_UID:-991}
      GID: ${SYNAPSE_GID:-991}
      TZ: UTC
    command:
      - run
      - --config-path=/data/homeserver.yaml
      - --config-path=/etc/synapse/closed-private.yaml
      - --config-path=/run/secrets/synapse_database.yaml
    secrets:
      - source: synapse_database
        target: synapse_database.yaml
        uid: "${SYNAPSE_UID:-991}"
        gid: "${SYNAPSE_GID:-991}"
        mode: 0400
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - synapse_data:/data
      - ./synapse/closed-private.yaml:/etc/synapse/closed-private.yaml:ro
    expose:
      - "8008"
    networks:
      - edge
      - database
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    cap_add:
      # The maintained image entrypoint prepares /data and then drops to the
      # configured UID/GID. No network or host-management capability is kept.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 60s
    logging: *bounded-logging

  caddy:
    image: ${CADDY_IMAGE:?Copy .env.example to .env and pin an image digest}
    restart: unless-stopped
    init: true
    environment:
      MATRIX_PUBLIC_HOST: ${MATRIX_PUBLIC_HOST:?Set MATRIX_PUBLIC_HOST in .env}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?Set CADDY_ACME_EMAIL in .env}
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    logging: *bounded-logging

networks:
  edge:
  database:
    internal: true

volumes:
  postgres_data:
  synapse_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./runtime/secrets/postgres_password.txt
  synapse_database:
    file: ./runtime/secrets/synapse_database.yaml
